[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,RESEND_API_KEY,ZETTLE_API_KEY,ZETTLE_CLIENT_ID,TODOIST_ICS_URL,SUPABASE_SERVICE_KEY,HBF_ADMIN_TOKEN,STRIPE_TICKET_WEBHOOK_SECRET,STRIPE_TICKET_SECRET_KEY,BREVO_API_KEY"

# Hourly Airbnb iCal sync - runs at the top of every hour
[functions."sync-all-icals"]
  schedule = "0 * * * *"

# Daily lettings email reminders (deposit/balance due, arrival info) - runs at 7am
[functions."send-accom-reminders"]
  schedule = "0 7 * * *"

# Daily data snapshot - runs at 3am, keeps the last 30 days
[functions."backup-data"]
  schedule = "0 3 * * *"

# Weekly housekeeping summary. Netlify cron is UTC-only, so this fires at both
# 02:00 and 03:00 UTC and the function sends only when it is 3am in London —
# that way it lands at 3am local through GMT and BST alike. The run that isn't
# 3am local exits immediately, as does any run on the wrong weekday.
[functions."send-cleaning-summary"]
  schedule = "0 2,3 * * *"

# Box office: balance emails, the single overdue chase, and event reminders.
# Runs an hour after the lettings reminders so the two don't compete for the
# Resend rate limit on a busy morning.
[functions."box-billing"]
  schedule = "0 8 * * *"

# Box office hygiene: clear out abandoned checkouts. The 15-minute hold in
# box_reserve_order() is what actually frees the seats — this only stops an
# abandoned buyer's name and email sitting in the table for ever.
[functions."expire-ticket-holds"]
  schedule = "17 * * * *"

# Top up the Brevo lists from ticket sales, weddings booked, event enquiries
# and cottage bookings. Once a day is plenty: these are mailing lists, not
# something anybody is waiting on, and the Sync now button in Settings covers
# the moment you do want it immediately. Brevo's import upserts, so the first
# run is the backfill and every run after picks up whoever is new.
#
# 02:40 UTC — clear of the cleaning summary at 02:00 and the backup at 03:00,
# so the three do not compete. Netlify cron is UTC, so this lands at 03:40 in
# London through the summer; nothing here cares which.
#
# The schedule sits on the shim, not on brevo-sync itself: Netlify returns 403
# to any HTTP request aimed at a scheduled function, so scheduling the worker
# directly would make it impossible to run on demand or to test.
[functions."brevo-sync-cron"]
  schedule = "40 2 * * *"

# Ask SignWell what has happened to every contract still out for signature, so
# the home page is truthful without anyone opening an event and pressing
# "Check status". 04:00 UTC: after the 03:00 backup — so there is always a
# snapshot from before the sweep — and at an hour when nobody is in the app,
# which is what makes a background write to the events array acceptable here
# when a webhook still is not. See the header of check-contracts.js.
[functions."check-contracts"]
  schedule = "0 4 * * *"

# Proxy Xero connections endpoint
[[redirects]]
  from = "/api/xero-connections"
  to = "https://api.xero.com/connections"
  status = 200
  force = true

# Proxy Xero accounting API
[[redirects]]
  from = "/api/xero-api/*"
  to = "https://api.xero.com/api.xro/2.0/:splat"
  status = 200
  force = true

# Clean per-property calendar URLs. Airbnb rejects the raw function URL —
# it wants something that looks like a calendar file, ending in .ics, and
# the old Bookalet feeds did too. The splat carries "hamlet.ics" through as
# the id and the function strips the extension.
#   https://hawthbushfarm.netlify.app/ical/hamlet.ics
[[redirects]]
  from = "/ical/*"
  to = "/.netlify/functions/property-calendar?id=:splat"
  status = 200
  force = true

# Clean URL for the hosted iCalendar feed (events + viewings)
[[redirects]]
  from = "/calendar.ics"
  to = "/.netlify/functions/calendar-feed"
  status = 200
  force = true

# ── Box office public pages ──────────────────────────────────────────────────
# These must stay above the /* catch-all below, or every one of them ends up
# serving the React admin app instead.
[[redirects]]
  from = "/tickets/*"
  to = "/ticket-event.html"
  status = 200

[[redirects]]
  from = "/my-ticket/*"
  to = "/my-ticket.html"
  status = 200

[[redirects]]
  from = "/whats-on"
  to = "/whats-on.html"
  status = 200

# The brochure request form on Squarespace posts to submit-brochure and then
# sends the visitor here. Above the catch-all, like everything else with a
# clean URL, or /brochure-thanks serves the staff app instead.
[[redirects]]
  from = "/brochure-thanks"
  to = "/brochure-thanks.html"
  status = 200

# ── Client portal ────────────────────────────────────────────────────────────
# Its own Vite entry (portal.html), so the bundle a wedding client downloads
# contains none of the staff app. Must stay above the /* catch-all, like the
# box office pages above, or /portal serves the admin app instead.
#
# The magic link comes back to /portal with the token in the URL fragment, so
# this has to answer that exact path.
# The portal on its own address. A domain alias serves the SAME site, so
# without this the root of portal.hawthbushfarm.co.uk would show the staff
# app's sign-in — harmless, since it needs an account, but wrong.
#
# Exact path, no splat, deliberately: a wildcard here would also swallow
# /assets/* and /.netlify/functions/*, and the portal would load a page with no
# JavaScript and no way to ask for a sign-in link. Inert until the alias exists.
[[redirects]]
  from = "https://portal.hawthbushfarm.co.uk/"
  to = "/portal.html"
  status = 200
  force = true

[[redirects]]
  from = "/portal"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
