[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY"

[[redirects]]
  from = "/api/xero-connections"
  to = "https://api.xero.com/connections"
  status = 200
  force = true

[[redirects]]
  from = "/api/xero-api/*"
  to = "https://api.xero.com/api.xro/2.0/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
