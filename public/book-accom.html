<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Stay | Hawthbush Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Jost', sans-serif; background: #f9f6f1; color: #2d2a25; min-height: 100vh; }
    .header { background: #fff; border-bottom: 1px solid #e8e2d9; padding: 22px 40px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; color: #2d2a25; letter-spacing: .5px; }
    .header .sub { font-size: 13px; color: #7a7060; font-weight: 400; margin-top: 2px; }
    .main { max-width: 1080px; margin: 0 auto; padding: 36px 20px 80px; }

    /* Steps */
    .steps { display: flex; margin-bottom: 32px; border-radius: 10px; overflow: hidden; border: 1px solid #e8e2d9; }
    .step { flex: 1; padding: 11px 8px; text-align: center; background: #f9f6f1; font-size: 12px; font-weight: 600; color: #9a9080; border-right: 1px solid #e8e2d9; }
    .step:last-child { border-right: none; }
    .step.active { background: #2d2a25; color: #fff; }
    .step.done { background: #edf7ed; color: #3d7a3d; }

    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 600; margin-bottom: 6px; color: #2d2a25; }
    .page-sub { font-size: 14px; color: #7a7060; margin-bottom: 24px; line-height: 1.5; }
    .section-heading { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: #2d2a25; margin: 24px 0 12px; }
    .section-heading em { font-style: italic; color: #9a8360; }

    /* Property cards (used for the per-stay property picker) */
    .prop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 6px; }
    .prop-card { background: #fff; border: 2px solid #e8e2d9; border-radius: 12px; padding: 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .prop-card:hover { border-color: #b8a88a; box-shadow: 0 4px 18px rgba(0,0,0,.07); }
    .prop-card.selected { border-color: var(--col); box-shadow: 0 0 0 3px var(--col-faint); }
    .prop-card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
    .prop-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .prop-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; flex: 1; }
    .prop-meta { font-size: 12px; color: #7a7060; line-height: 1.5; }
    .prop-rate { font-size: 12px; color: #2d2a25; font-weight: 500; margin-top: 5px; }

    /* Panel */
    .panel { background: #fff; border: 1px solid #e8e2d9; border-radius: 14px; padding: 24px 26px; margin-bottom: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    .panel h3 { font-family: 'Cormorant Garamond', serif; font-size: 21px; font-weight: 600; color: #2d2a25; margin-bottom: 14px; }

    /* 6-month calendar grid */
    .cal-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .cal-nav-btn { width: 38px; height: 38px; border-radius: 9px; border: 1.5px solid #e0d9ce; background: #fff; color: #2d2a25; font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color .15s, color .15s; }
    .cal-nav-btn:hover:not(:disabled) { border-color: #b8a88a; }
    .cal-nav-btn:disabled { color: #d8d2c6; cursor: not-allowed; }
    .cal-nav-label { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; color: #2d2a25; min-width: 190px; text-align: center; }
    .cal-months-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 14px; }
    @media (max-width: 900px) { .cal-months-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .cal-months-grid { grid-template-columns: 1fr; } }
    .mini-cal { background: #fff; border: 1px solid #e8e2d9; border-radius: 12px; padding: 12px; }
    .mini-cal-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 15px; margin-bottom: 8px; text-align: center; color: #2d2a25; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow { text-align: center; font-size: 9px; font-weight: 700; color: #b8a88a; padding-bottom: 4px; }
    .cal-cell { border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 38px; font-size: 11px; }
    .cal-cell.pad { background: transparent; }
    .cal-num { font-size: 11px; font-weight: 600; line-height: 1; }
    .day-letters { display: flex; gap: 2px; line-height: 1; }
    .day-letter { font-size: 8px; font-weight: 800; letter-spacing: .2px; }
    .cal-cell.day-past { background: #f4f2ef; color: #ccc8c0; }
    .cal-cell.day-blocked { background: #fff; color: #c7c2b8; }
    .cal-cell.day-avail-only { background: #e3f7e6; color: #3d7a4a; }
    .cal-cell.day-checkin { background: #8fdba0; color: #1a4d28; cursor: pointer; transition: transform .1s; }
    .cal-cell.day-checkin:hover { transform: scale(1.08); z-index: 2; }
    .cal-cell.day-selected { background: #2d2a25 !important; color: #fff !important; }
    .cal-cell.day-selected .day-letter { color: #fff !important; }

    /* Hover price card. The scale transform on .day-checkin:hover creates a
       containing block, so the tip is positioned against the cell itself and
       centred with a translate rather than left:0/right:0. */
    .cal-cell { position: relative; }
    .day-tip {
      position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
      background: #2d2a25; color: #fff; border-radius: 8px; padding: 8px 10px;
      width: 172px; z-index: 40; text-align: left; line-height: 1.45;
      box-shadow: 0 8px 22px rgba(0,0,0,.22);
      opacity: 0; visibility: hidden; transition: opacity .12s ease;
      pointer-events: none; font-size: 11px; white-space: normal;
    }
    .day-tip::after {
      content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      border: 5px solid transparent; border-top-color: #2d2a25;
    }
    .cal-cell:hover > .day-tip { opacity: 1; visibility: visible; }
    .day-tip-date { font-weight: 700; font-size: 10px; letter-spacing: .3px; text-transform: uppercase; color: #c9bfa8; margin-bottom: 5px; }
    .day-tip-row { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
    .day-tip-name { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .day-tip-name span.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .day-tip-price { font-weight: 700; flex-shrink: 0; }
    .day-tip-note { margin-top: 5px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,.18); color: #c9bfa8; font-size: 10px; }
    /* Near the right-hand edge the tip would overflow the month card. */
    .cal-cell:nth-child(7n) .day-tip,
    .cal-cell:nth-child(7n+6) .day-tip { left: auto; right: -4px; transform: none; }
    .cal-cell:nth-child(7n) .day-tip::after,
    .cal-cell:nth-child(7n+6) .day-tip::after { left: auto; right: 14px; transform: none; }
    .cal-cell:nth-child(7n+1) .day-tip,
    .cal-cell:nth-child(7n+2) .day-tip { left: -4px; right: auto; transform: none; }
    .cal-cell:nth-child(7n+1) .day-tip::after,
    .cal-cell:nth-child(7n+2) .day-tip::after { left: 14px; right: auto; transform: none; }
    /* Touch screens have no hover — the tip would stick after a tap. */
    @media (hover: none) { .day-tip { display: none; } }

    .terms-accept { display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 1.5px solid #e8e2d9; border-radius: 10px; padding: 13px 15px; margin: 4px 0 16px; cursor: pointer; font-size: 14px; line-height: 1.55; color: #2d2a25; transition: border-color .15s, background .15s; }
    .terms-accept:hover { border-color: #b8a88a; }
    .terms-accept.on { border-color: #3d7a4a; background: #f4fbf5; }
    .terms-accept input { width: 17px; height: 17px; margin-top: 1px; flex-shrink: 0; accent-color: #3d7a4a; cursor: pointer; }
    .terms-accept a { color: #2d2a25; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; font-size: 12px; color: #7a7060; align-items: center; }
    .leg-item { display: flex; align-items: center; gap: 5px; }
    .leg-swatch { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
    .letter-key { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: #7a7060; margin-bottom: 22px; }
    .letter-key b { font-size: 12px; margin-right: 4px; }

    /* Cart summary */
    .cart-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; flex-wrap: wrap; }
    .cart-row + .cart-row { border-top: 1px solid #f0ece4; }

    /* Quote */
    .quote-box { background: #fdfaf6; border: 1.5px solid #d4c8b0; border-radius: 10px; padding: 16px 18px; margin: 14px 0 18px; }
    .q-row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; color: #2d2a25; gap: 12px; }
    .q-row.tot { font-weight: 700; font-size: 16px; border-top: 1px solid #e0d9ce; margin-top: 8px; padding-top: 9px; }
    .q-row.dep { color: #5a7a3a; font-weight: 600; }
    .q-row.bal { font-size: 12px; color: #9a9080; }

    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { font-size: 11px; font-weight: 600; color: #7a7060; text-transform: uppercase; letter-spacing: .5px; }
    .form-field input, .form-field textarea, .form-field select {
      background: #fafaf8; border: 1.5px solid #e0d9ce; border-radius: 8px; color: #2d2a25;
      font-family: 'Jost', sans-serif; font-size: 14px; padding: 10px 13px; outline: none; transition: border-color .15s;
    }
    .form-field input:focus, .form-field textarea:focus, .form-field select:focus { border-color: #b8a88a; box-shadow: 0 0 0 3px #f0e8d840; }

    .nights-select { background: #fafaf8; border: 1.5px solid #e0d9ce; border-radius: 8px; color: #2d2a25; font-family: 'Jost', sans-serif; font-size: 14px; padding: 10px 13px; outline: none; width: 100%; max-width: 360px; }

    /* Buttons */
    .btn-primary { display: block; width: 100%; padding: 14px 24px; background: #2d2a25; color: #fff; border: none; border-radius: 10px; font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; transition: background .15s; letter-spacing: .2px; }
    .btn-primary:hover { background: #4a4540; }
    .btn-primary:disabled { background: #c0bab0; cursor: not-allowed; }
    .btn-ghost { padding: 10px 20px; background: none; color: #7a7060; border: 1.5px solid #e0d9ce; border-radius: 9px; font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-ghost:hover { border-color: #b8a88a; color: #2d2a25; }

    /* Alert */
    .alert { border-radius: 8px; padding: 11px 15px; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
    .alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .alert-warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

    .divider { border: none; border-top: 1px solid #e8e2d9; margin: 22px 0; }
    .stripe-note { font-size: 12px; color: #9a9080; text-align: center; margin-top: 10px; }

    @media (max-width: 600px) {
      .header { padding: 16px 18px; }
      .main { padding: 20px 12px 60px; }
      .form-grid { grid-template-columns: 1fr; }
      .prop-grid { grid-template-columns: 1fr; }
    }

    /* ── View toggle (compact vs standard) ─────────────────────────────────── */
    .view-toggle { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-bottom: 10px; font-size: 12px; color: #9a9080; }
    .view-toggle button { padding: 5px 12px; background: none; border: 1.5px solid #e0d9ce; border-radius: 20px; font-family: 'Jost', sans-serif; font-size: 12px; color: #7a7060; cursor: pointer; }
    .view-toggle button.on { background: #2d2a25; border-color: #2d2a25; color: #fff; font-weight: 600; }

    /* ══ COMPACT MODE ══════════════════════════════════════════════════════════
       Purely additive overrides, all scoped under body.compact-mode. Removing
       the class (or the ?compact=1 param) restores the standard layout exactly,
       so this is safe to trial and trivial to roll back.                        */
    body.compact-mode .main { max-width: 760px; padding: 18px 14px 50px; }
    body.compact-mode .header { padding: 12px 20px; }
    body.compact-mode .header h1 { font-size: 21px; }
    body.compact-mode .header .sub { font-size: 11px; }

    body.compact-mode .steps { margin-bottom: 16px; border-radius: 8px; }
    body.compact-mode .step { padding: 7px 5px; font-size: 10.5px; }

    body.compact-mode .page-title { font-size: 23px; margin-bottom: 3px; }
    body.compact-mode .page-sub { font-size: 12.5px; margin-bottom: 14px; }
    body.compact-mode .section-heading { font-size: 17px; margin: 15px 0 8px; }

    body.compact-mode .panel { padding: 14px 15px; margin-bottom: 12px; border-radius: 11px; }
    body.compact-mode .panel h3 { font-size: 17px; margin-bottom: 9px; }

    /* Property cards: tighter, 3-across on desktop, 2-across even on phones */
    body.compact-mode .prop-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    body.compact-mode .prop-card { padding: 9px 10px; border-radius: 9px; border-width: 1.5px; }
    body.compact-mode .prop-card-head { gap: 6px; margin-bottom: 3px; }
    body.compact-mode .prop-dot { width: 9px; height: 9px; }
    body.compact-mode .prop-name { font-size: 14.5px; }
    body.compact-mode .prop-meta { font-size: 10.5px; line-height: 1.35; }
    body.compact-mode .prop-rate { font-size: 10.5px; margin-top: 2px; }

    /* Calendar: 3 months, tighter cells */
    body.compact-mode .cal-nav { gap: 8px; margin-bottom: 10px; }
    body.compact-mode .cal-nav-btn { width: 32px; height: 32px; font-size: 17px; border-radius: 8px; }
    body.compact-mode .cal-nav-label { font-size: 16px; min-width: 150px; }
    body.compact-mode .cal-months-grid { grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 10px; }
    body.compact-mode .mini-cal { padding: 8px 7px; border-radius: 9px; }
    body.compact-mode .mini-cal-title { font-size: 13px; margin-bottom: 5px; }
    body.compact-mode .cal-grid { gap: 2px; }
    body.compact-mode .cal-dow { font-size: 8px; padding-bottom: 2px; }
    body.compact-mode .cal-cell { min-height: 27px; border-radius: 4px; gap: 0; }
    body.compact-mode .cal-num { font-size: 10px; }
    body.compact-mode .day-letter { font-size: 7px; }
    body.compact-mode .day-letters { gap: 1px; }

    body.compact-mode .legend { gap: 9px; font-size: 10.5px; margin-bottom: 10px; }
    body.compact-mode .leg-swatch { width: 10px; height: 10px; }
    body.compact-mode .letter-key { font-size: 10.5px; gap: 8px; margin-bottom: 12px; }
    body.compact-mode .letter-key b { font-size: 10.5px; }

    body.compact-mode .quote-box { padding: 11px 13px; margin: 10px 0 12px; }
    body.compact-mode .q-row { font-size: 12.5px; }
    body.compact-mode .q-row.tot { font-size: 14px; }
    body.compact-mode .btn-primary { padding: 11px 20px; font-size: 14px; margin-top: 11px; }
    body.compact-mode .btn-ghost { padding: 7px 14px; font-size: 12px; }
    body.compact-mode .nights-select { padding: 8px 11px; font-size: 13px; max-width: 100%; }
    body.compact-mode .alert { padding: 8px 12px; font-size: 12px; margin-bottom: 10px; }
    body.compact-mode .form-grid { gap: 9px; }
    body.compact-mode .form-field input, body.compact-mode .form-field textarea { padding: 8px 11px; font-size: 13px; }
    body.compact-mode .divider { margin: 15px 0; }
    body.compact-mode .cart-row { padding: 5px 0; }

    /* Compact on small screens: keep 3 calendars side by side as long as we can,
       drop to 2 only when genuinely too narrow. */
    @media (max-width: 560px) {
      body.compact-mode .cal-months-grid { grid-template-columns: repeat(2, 1fr); gap: 7px; }
      body.compact-mode .cal-cell { min-height: 25px; }
      body.compact-mode .prop-grid { grid-template-columns: repeat(2, 1fr); }
      body.compact-mode .main { padding: 14px 9px 40px; }
    }
    @media (max-width: 380px) {
      body.compact-mode .cal-months-grid { grid-template-columns: 1fr; }
      body.compact-mode .prop-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>Hawthbush Farm</h1>
    <div class="sub">East Sussex &mdash; Holiday cottages &amp; glamping</div>
  </div>
  <a href="/" style="font-size:13px; color:#7a7060; text-decoration:none;">&#8592; Back to website</a>
</div>

<div class="main" id="app">
  <div style="text-align:center; padding:60px; color:#9a9080;">Loading availability&hellip;</div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
var SUPABASE_URL  = "https://rkqbyisfmvwulsyxzwjz.supabase.co";
var SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrcWJ5aXNmbXZ3dWxzeXh6d2p6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTI0MzgsImV4cCI6MjA5NjUyODQzOH0._CsyhvFrtHFC0KrfiLzbrLUaKcvxtbWlHydaH20tvfo";
var CHECKOUT_FN   = "/.netlify/functions/create-accom-checkout";
var SYNC_FN       = "/.netlify/functions/sync-all-icals";
var MONTH_NAMES   = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOW_LABELS    = ["M","T","W","T","F","S","S"];
var MAX_PROPERTIES_PER_BOOKING = 3;

// ── State ─────────────────────────────────────────────────────────────────────
var S = {
  properties: [],
  bookings: [],
  compact: true,          // compact/mobile-friendly layout — the default; opt out via ?compact=0
  calMonths: [],          // the {year,month} entries currently shown on the calendar
  calOffset: 0,           // how many months forward the calendar window has been scrolled
  occupied: {},           // propId -> Set of dateStr  [ci, co) exclusive
  // the stay currently being configured (not yet added to the cart)
  pendingCheckIn: null,
  pendingPropertyId: null,
  pendingNights: null,
  // stays already committed to this booking
  cart: [],               // [{propertyId, propertyName, checkIn, checkOut, nights, value}]
  view: "calendar",       // "calendar" | "summary"
  // guest details
  guestName: "", email: "", phone: "", guestCount: 2, notes: "",
  termsText: "",          // set at load; empty means no T&C published, so no tickbox
  termsAccepted: false,
  submitting: false, error: ""
};

// ── Supabase ──────────────────────────────────────────────────────────────────
function sbGet(key) {
  return fetch(SUPABASE_URL + "/rest/v1/app_data?key=eq." + key + "&select=value", {
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
  }).then(function(r) { return r.json(); }).then(function(rows) {
    return (rows && rows[0]) ? rows[0].value : null;
  });
}

// ── Date helpers ──────────────────────────────────────────────────────────────
// IMPORTANT: date-only strings (YYYY-MM-DD) are parsed/formatted anchored to
// UTC noon-of-nothing (Date.UTC), never via `new Date(iso + "T00:00:00")".
// That local-time-parse pattern silently shifts dates by a day once the
// server or browser is in a non-UTC offset (e.g. British Summer Time),
// because toISOString()/local getters convert across the offset. Since this
// page is used by UK guests for most of the year during BST, that bug would
// corrupt every check-in/check-out date calculation. Keep all date-string
// math UTC-anchored via parseISO/toISO below.
function parseISO(iso) {
  var parts = iso.split("-");
  return new Date(Date.UTC(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10)));
}
function toISO(d) {
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
}
function addDays(iso, n) {
  var d = parseISO(iso);
  d.setUTCDate(d.getUTCDate() + n);
  return toISO(d);
}
function fmtDate(iso) {
  if (!iso) return "";
  return parseISO(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
}
function fmt(n) { return "£" + Number(n || 0).toLocaleString("en-GB", { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function isoDate(y, m, d) { return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0"); }
// "Today" is deliberately read from LOCAL getters (no UTC round-trip) since
// this is "what calendar date is it right now for the person looking at the
// page" — not a stored date-only value.
function today() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function escHtml(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function propLetter(p) {
  var n = (p.name || p.id || "").toLowerCase();
  if (n.indexOf("hamlet") >= 0) return "H";
  if (n.indexOf("amly") >= 0) return "A";
  if (n.indexOf("glamp") >= 0 || n.indexOf("camping") >= 0) return "G";
  return (p.name || p.id || "?").charAt(0).toUpperCase();
}

// ── Pricing ───────────────────────────────────────────────────────────────────
// Seasons are stored in priority order, highest first (set with the ▲▼ buttons
// in Settings → Properties). Where ranges overlap the one nearer the top of the
// list wins, which is what scanning top-down and stopping at the first match
// gives. Must stay identical to getPriceForNight/seasonForDate in App.jsx or
// the price quoted here won't match the price shown in the office.
function getPriceForNight(prop, dateStr) {
  if (!prop) return 0;
  var s = seasonForDate(prop, dateStr);
  if (s) return Number(s.ratePerNight) || 0;
  return Number(prop.baseRate) || 0;
}

// Long-stay discount off the subtotal. The setting is a percentage; a property
// configured before that change still holds a £-per-night figure in the old
// longStayDiscount field, which keeps applying until a percentage is set.
// Must stay identical to longStayDiscountAmount in App.jsx.
function longStayDiscountAmount(prop, nights, subtotal) {
  if (!prop || !(prop.longStayThreshold > 0) || !(nights >= prop.longStayThreshold)) return 0;
  var r2 = function(n) { return Math.round(n * 100) / 100; };
  var pct = Number(prop.longStayDiscountPct) || 0;
  if (pct > 0) return Math.min(r2(subtotal), r2(subtotal * pct / 100));
  var legacyPerNight = Number(prop.longStayDiscount) || 0;
  return legacyPerNight > 0 ? Math.min(r2(subtotal), r2(legacyPerNight * nights)) : 0;
}

function quoteStay(prop, ci, co) {
  if (!prop || !ci || !co) return null;
  var nights = Math.round((parseISO(co) - parseISO(ci)) / 86400000);
  if (nights <= 0) return null;
  var sub = 0;
  var d = parseISO(ci);
  for (var i = 0; i < nights; i++) {
    sub += getPriceForNight(prop, toISO(d));
    d.setUTCDate(d.getUTCDate() + 1);
  }
  var disc = longStayDiscountAmount(prop, nights, sub);
  return { nights: nights, subtotal: sub, discount: disc, total: Math.max(0, Math.round((sub - disc) * 100) / 100) };
}

// ── Booking rules: allowed check-in/out weekdays + booking window (per property) ─
function seasonForDate(prop, ds) {
  if (!prop.seasons) return null;
  for (var i = 0; i < prop.seasons.length; i++) {
    var s = prop.seasons[i];
    if (s.startDate && s.endDate && ds >= s.startDate && ds < s.endDate) return s;
  }
  return null;
}
// 0=Mon..6=Sun, to match the DOW_LABELS / DayToggles ordering used in Settings
function isoWeekday(ds) {
  var jsDay = parseISO(ds).getUTCDay(); // 0=Sun..6=Sat
  return (jsDay + 6) % 7;
}
function allowedCheckInDaysForProp(prop, ds) {
  var season = seasonForDate(prop, ds);
  if (season && season.checkInDays && season.checkInDays.length) return season.checkInDays;
  if (prop.checkInDays && prop.checkInDays.length) return prop.checkInDays;
  return null; // no restriction
}
function allowedCheckOutDaysForProp(prop, ds) {
  var season = seasonForDate(prop, ds);
  if (season && season.checkOutDays && season.checkOutDays.length) return season.checkOutDays;
  if (prop.checkOutDays && prop.checkOutDays.length) return prop.checkOutDays;
  return null;
}
// Stay-length limits for a given check-in date. A season may override either;
// blank or zero means inherit the property's own figure. Where two seasons
// overlap, seasonForDate has already picked the higher-priority one, so its
// limits are the ones that apply — same rule as the nightly rate.
// Mirrors minNightsForDate / maxNightsForDate in App.jsx.
function minNightsForProp(prop, ds) {
  var s = ds ? seasonForDate(prop, ds) : null;
  var v = s && Number(s.minNights);
  return (v && v > 0) ? v : (Number(prop && prop.minNights) || 2);
}
function maxNightsForProp(prop, ds) {
  var s = ds ? seasonForDate(prop, ds) : null;
  var v = s && Number(s.maxNights);
  return (v && v > 0) ? v : (Number(prop && prop.maxNights) || 28);
}
function checkInAllowedForProp(prop, ds) {
  var allowed = allowedCheckInDaysForProp(prop, ds);
  return !allowed || allowed.indexOf(isoWeekday(ds)) !== -1;
}
function checkOutAllowedForProp(prop, ds) {
  var allowed = allowedCheckOutDaysForProp(prop, ds);
  return !allowed || allowed.indexOf(isoWeekday(ds)) !== -1;
}
// Booking window: blank/0 = unlimited for that property
function withinHorizonForProp(prop, ds) {
  if (!prop.bookingHorizonMonths) return true;
  var now = new Date();
  var limit = new Date(now.getFullYear(), now.getMonth() + Number(prop.bookingHorizonMonths), now.getDate());
  var limitIso = limit.getFullYear() + "-" + String(limit.getMonth() + 1).padStart(2, "0") + "-" + String(limit.getDate()).padStart(2, "0");
  return ds <= limitIso;
}

// ── Build availability maps ───────────────────────────────────────────────────
// How long an unpaid online booking holds its dates. The booking row is
// written before the guest is sent to Stripe, so without an expiry an
// abandoned checkout would block those nights for everyone, permanently.
// Generous enough to cover someone fetching their card; the webhook flips the
// status to "confirmed" the instant payment lands, after which it holds
// indefinitely as a real booking.
var PENDING_HOLD_MINUTES = 60;

function pendingHoldExpired(b) {
  if (b.status !== "pending") return false;
  var deposit = (b.schedule || []).find(function(s) { return s.label === "Deposit"; });
  if (deposit && deposit.paid) return false;      // paid but status not yet updated — keep the hold
  if (!b.createdAt) return false;                 // no timestamp to judge by, so leave it holding
  var age = Date.now() - new Date(b.createdAt).getTime();
  return isFinite(age) && age > PENDING_HOLD_MINUTES * 60 * 1000;
}

function buildAvailability() {
  S.occupied = {};
  S.bookings.forEach(function(b) {
    if (b.status === "cancelled") return;
    if (pendingHoldExpired(b)) return;
    var stays = (b.stays && b.stays.length) ? b.stays : [b];
    stays.forEach(function(st) {
      if (!st.propertyId || !st.checkIn || !st.checkOut) return;
      var pid = st.propertyId;
      if (!S.occupied[pid]) S.occupied[pid] = new Set();
      var d = parseISO(st.checkIn);
      var co = parseISO(st.checkOut);
      while (d < co) { S.occupied[pid].add(toISO(d)); d.setUTCDate(d.getUTCDate() + 1); }
    });
  });
}

function propAvailable(prop, ds) {
  if (ds < today()) return false;
  if (!withinHorizonForProp(prop, ds)) return false;
  var occ = S.occupied[prop.id] || new Set();
  return !occ.has(ds);
}
function propCheckInOk(prop, ds) {
  return propAvailable(prop, ds) && checkInAllowedForProp(prop, ds);
}
// How many consecutive free nights from checkIn, for a single property
function maxFreeNightsForProp(prop, ci) {
  var occ = S.occupied[prop.id] || new Set();
  var maxN = 28;
  for (var i = 1; i <= 28; i++) {
    var ds = addDays(ci, i);
    if (occ.has(ds)) { maxN = i; break; }
  }
  return maxN;
}

// Which properties are available / valid-check-in on a given date
function dayInfo(ds, propList) {
  var list = propList || S.properties;
  var avail = [], checkinOk = [];
  list.forEach(function(p) {
    if (propAvailable(p, ds)) {
      avail.push(p);
      if (checkInAllowedForProp(p, ds)) checkinOk.push(p);
    }
  });
  return { avail: avail, checkinOk: checkinOk };
}

// Which properties the calendar should currently be showing: if the guest
// has already picked a property (property-first path, or after picking one
// from the date-first picker), narrow the calendar down to just that one so
// its availability is what's shown. Otherwise show every property not yet
// committed to the booking (a property already in the cart can't be picked
// again for a second stay).
function calendarFilterProperties() {
  var usedIds = S.cart.map(function(s) { return s.propertyId; });
  var remaining = S.properties.filter(function(p) { return usedIds.indexOf(p.id) === -1; });
  if (S.pendingPropertyId) {
    var only = remaining.filter(function(p) { return p.id === S.pendingPropertyId; });
    if (only.length) return only;
  }
  return remaining;
}

// ── Render infrastructure ─────────────────────────────────────────────────────
function stepsHtml(active) {
  var labels = ["1. Select your stay", "2. Your details", "3. Confirmed"];
  var html = '<div class="steps">';
  for (var i = 0; i < labels.length; i++) {
    var cls = "step" + (i + 1 === active ? " active" : i + 1 < active ? " done" : "");
    html += '<div class="' + cls + '" id="stp-' + (i+1) + '">' + labels[i] + '</div>';
  }
  html += '</div>';
  return html;
}

function mount(html) {
  document.getElementById("app").innerHTML = html;
  reportHeight();
}

// ── Embedding support ────────────────────────────────────────────────────────
// The page is several screens tall and changes height as the guest moves
// through it, so a fixed iframe height either clips the calendar or leaves a
// gap. The height is posted to the parent after every render; the snippet on
// the host page listens and resizes. Harmless when not embedded.
var lastReportedHeight = 0;
function reportHeight() {
  if (window.parent === window.self) return;
  var h = Math.max(
    document.body.scrollHeight, document.documentElement.scrollHeight,
    document.body.offsetHeight, document.documentElement.offsetHeight
  );
  if (Math.abs(h - lastReportedHeight) < 12) return;   // ignore sub-pixel churn
  lastReportedHeight = h;
  // "*" because the host page is on a different domain (Squarespace) and the
  // only thing being sent is a number — no booking or guest data.
  window.parent.postMessage({ hawthbushHeight: h }, "*");
}
window.addEventListener("load", reportHeight);
window.addEventListener("resize", reportHeight);
setInterval(reportHeight, 800);   // catches images loading and font swaps

// Compact mode shows 3 months at a time (nicer on a phone); standard shows 6.
// The nav arrows always step by exactly one screenful.
function monthsShown() { return S.compact ? 3 : 6; }

function calMonthsList(offset) {
  offset = offset || 0;
  var n = new Date();
  var list = [];
  var count = monthsShown();
  for (var i = 0; i < count; i++) {
    var y = n.getFullYear(), m = n.getMonth() + offset + i;
    while (m > 11) { m -= 12; y++; }
    while (m < 0)  { m += 12; y--; }
    list.push({ year: y, month: m });
  }
  return list;
}

function shiftCalMonths(delta) {
  var next = S.calOffset + delta;
  if (next < 0) next = 0; // never scroll back before the current month
  S.calOffset = next;
  S.calMonths = calMonthsList(S.calOffset);
  renderCalendarView();
}

// Flip between compact and standard. Keeps the guest's place in the calendar,
// syncs the URL so the choice survives a refresh / can be shared, and simply
// re-renders — no reload, nothing else in the flow is affected.
function setCompact(on) {
  S.compact = !!on;
  applyCompactClass();
  S.calMonths = calMonthsList(S.calOffset);
  try {
    var url = new URL(window.location.href);
    // Compact is the default, so it needs no param; only the opt-out is stored.
    if (S.compact) url.searchParams.delete("compact");
    else url.searchParams.set("compact", "0");
    window.history.replaceState({}, "", url);
  } catch (e) { /* non-fatal — layout still switches */ }
  if (S.view === "summary") renderSummaryView(); else renderCalendarView();
}

function applyCompactClass() {
  if (typeof document === "undefined") return;
  if (S.compact) document.body.classList.add("compact-mode");
  else document.body.classList.remove("compact-mode");
}

function renderViewToggle() {
  var html = '<div class="view-toggle"><span>Layout</span>';
  html += '<button class="' + (S.compact ? "" : "on") + '" onclick="setCompact(false)">Standard</button>';
  html += '<button class="' + (S.compact ? "on" : "") + '" onclick="setCompact(true)">Compact</button>';
  html += '</div>';
  return html;
}

// Hover card for a calendar day: what's free that night and what it costs.
// Prices are per night for THAT date, so a guest can read the seasonal rate
// off the calendar without having to pick a date and work back from a total.
function dayTipHtml(ds, info) {
  var html = '<span class="day-tip">';
  html += '<span class="day-tip-date">' + escHtml(fmtDate(ds)) + '</span>';

  if (!info.avail.length) {
    html += '<span style="color:#c9bfa8">Nothing available this night.</span></span>';
    return html;
  }

  info.avail.forEach(function(p) {
    var rate = getPriceForNight(p, ds);
    html += '<span class="day-tip-row">';
    html += '<span class="day-tip-name"><span class="dot" style="background:' + escHtml(p.colour || "#fff") + '"></span>' + escHtml(p.name) + '</span>';
    html += '<span class="day-tip-price">' + (rate > 0 ? escHtml(fmt(rate)) : "&mdash;") + '</span>';
    html += '</span>';
  });

  // The letters show what's free; the green shading shows where a stay can
  // actually start. Spell out the difference rather than leaving the guest
  // to work out why an available night isn't clickable.
  var note = "";
  if (info.checkinOk.length) {
    var mins = info.checkinOk.map(function(p) { return minNightsForProp(p, ds); });
    var minN = Math.min.apply(null, mins);
    var maxN = Math.max.apply(null, mins);
    note = "Click to start a stay here"
         + (minN === maxN ? " (" + minN + " night min)" : " (" + minN + "&ndash;" + maxN + " night min)");
  } else {
    note = "Available, but stays can&rsquo;t start on this day.";
  }
  html += '<span class="day-tip-note">' + note + '</span>';
  html += '</span>';
  return html;
}

// ── One mini month calendar ───────────────────────────────────────────────────
function renderMiniMonth(year, month, propList) {
  var nDays = daysInMonth(year, month);
  var firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // 0=Mon
  var html = '<div class="mini-cal">';
  html += '<div class="mini-cal-title">' + MONTH_NAMES[month] + ' ' + year + '</div>';
  html += '<div class="cal-grid">';
  DOW_LABELS.forEach(function(d) { html += '<div class="cal-dow">' + d + '</div>'; });
  for (var p = 0; p < firstDow; p++) html += '<div class="cal-cell pad"></div>';

  for (var d = 1; d <= nDays; d++) {
    var ds = isoDate(year, month, d);
    var isPast = ds < today();
    var isSel = ds === S.pendingCheckIn;
    var info = isPast ? { avail: [], checkinOk: [] } : dayInfo(ds, propList);

    var cls = "cal-cell";
    var onclick = "";
    if (isPast) cls += " day-past";
    else if (info.checkinOk.length) { cls += " day-checkin"; onclick = ' onclick="selectCheckInDate(\'' + ds + '\')"'; }
    else if (info.avail.length) cls += " day-avail-only";
    else cls += " day-blocked";
    if (isSel) cls += " day-selected";

    html += '<div class="' + cls + '"' + onclick + '>';
    html += '<span class="cal-num">' + d + '</span>';
    if (info.avail.length) {
      html += '<span class="day-letters">';
      info.avail.forEach(function(p) {
        html += '<span class="day-letter" style="color:' + (p.colour || "#333") + '">' + propLetter(p) + '</span>';
      });
      html += '</span>';
    }
    if (!isPast) html += dayTipHtml(ds, info);
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function renderCalNav() {
  var first = S.calMonths[0], last = S.calMonths[S.calMonths.length - 1];
  var rangeLabel = MONTH_NAMES[first.month].slice(0, 3) + " " + first.year + " &ndash; " + MONTH_NAMES[last.month].slice(0, 3) + " " + last.year;
  var prevDisabled = S.calOffset <= 0;
  var step = monthsShown();
  var html = '<div class="cal-nav">';
  html += '<button class="cal-nav-btn" ' + (prevDisabled ? "disabled" : "") + ' onclick="shiftCalMonths(-' + step + ')" aria-label="Earlier months">&#8249;</button>';
  html += '<div class="cal-nav-label">' + rangeLabel + '</div>';
  html += '<button class="cal-nav-btn" onclick="shiftCalMonths(' + step + ')" aria-label="Later months">&#8250;</button>';
  if (S.calOffset > 0) html += '<button class="btn-ghost" style="margin-left:auto" onclick="jumpToThisMonth()">Back to today</button>';
  html += '</div>';
  return html;
}

function jumpToThisMonth() {
  S.calOffset = 0;
  S.calMonths = calMonthsList(0);
  renderCalendarView();
}

function renderCalLegend(propList) {
  var list = propList || S.properties;
  var html = '<div class="legend">';
  html += '<div class="leg-item"><div class="leg-swatch" style="background:#8fdba0"></div>Available to check in</div>';
  html += '<div class="leg-item"><div class="leg-swatch" style="background:#e3f7e6"></div>Available (not a check-in day)</div>';
  html += '<div class="leg-item"><div class="leg-swatch" style="background:#fff;border:1px solid #ddd"></div>Not available</div>';
  html += '</div>';
  html += '<div class="letter-key">';
  list.forEach(function(p) {
    html += '<span><b style="color:' + (p.colour || "#333") + '">' + propLetter(p) + '</b>' + escHtml(p.name) + '</span>';
  });
  html += '</div>';
  return html;
}

// "3 nights (£420 / night)". Where a stay straddles two seasons the nightly
// rate isn't a single figure, so the average is shown and labelled as such
// rather than quoting one of the rates and misleading on the others.
function nightsLabel(st) {
  var label = st.nights + " night" + (st.nights === 1 ? "" : "s");
  if (!st.nights || !(st.value > 0)) return label;

  var prop = S.properties.filter(function(p) { return p.id === st.propertyId; })[0];
  var varies = false;
  if (prop) {
    var first = null;
    for (var i = 0; i < st.nights; i++) {
      var r = getPriceForNight(prop, addDays(st.checkIn, i));
      if (first === null) first = r;
      else if (r !== first) { varies = true; break; }
    }
  }
  var perNight = st.value / st.nights;
  return label + " (" + (varies ? "avg " : "") + fmt(Math.round(perNight * 100) / 100) + " / night)";
}

function renderCartSummary() {
  if (!S.cart.length) return "";
  var html = '<div class="panel" style="padding:16px 20px">';
  html += '<div style="font-size:12px;font-weight:700;color:#7a7060;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Added to your booking</div>';
  S.cart.forEach(function(st, i) {
    html += '<div class="cart-row">';
    html += '<span style="font-size:13px">' + escHtml(st.propertyName) + ' &middot; ' + fmtDate(st.checkIn) + ' &rarr; ' + fmtDate(st.checkOut) + ' &middot; ' + nightsLabel(st) + '</span>';
    html += '<span style="display:flex;align-items:center;gap:10px"><strong>' + fmt(st.value) + '</strong><button class="btn-ghost" style="padding:3px 9px;font-size:11px" onclick="removeFromCart(' + i + ')">Remove</button></span>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// ── Pending stay: property + nights picker ───────────────────────────────────
function renderPendingNightsSelect(prop) {
  // Limits come from the season covering the check-in date, falling back to
  // the property's own settings.
  var minN = minNightsForProp(prop, S.pendingCheckIn);
  var maxN = Math.min(maxNightsForProp(prop, S.pendingCheckIn), maxFreeNightsForProp(prop, S.pendingCheckIn));

  var options = [];
  for (var n = minN; n <= maxN; n++) {
    var co = addDays(S.pendingCheckIn, n);
    if (!checkOutAllowedForProp(prop, co)) continue;
    var q = quoteStay(prop, S.pendingCheckIn, co);
    options.push({ n: n, co: co, price: (q && q.total > 0) ? fmt(q.total) : "—" });
  }

  var html = '<div style="margin-top:14px">';
  html += '<label style="display:block;font-size:11px;font-weight:600;color:#7a7060;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Number of nights</label>';
  if (!options.length) {
    html += '<div class="alert alert-warn">No valid stay length from this date for ' + escHtml(prop.name) + '. Try a different check-in date.</div></div>';
    return html;
  }
  html += '<select class="nights-select" onchange="selectPendingNights(this.value)">';
  html += '<option value="">Choose nights&hellip;</option>';
  options.forEach(function(o) {
    var sel = S.pendingNights === o.n ? " selected" : "";
    html += '<option value="' + o.n + '"' + sel + '>' + o.n + ' night' + (o.n === 1 ? "" : "s") + ' — ' + fmtDate(S.pendingCheckIn) + ' to ' + fmtDate(o.co) + ' — ' + o.price + '</option>';
  });
  html += '</select>';

  if (S.pendingNights) {
    var co2 = addDays(S.pendingCheckIn, S.pendingNights);
    var q2 = quoteStay(prop, S.pendingCheckIn, co2);
    var amt = q2 ? q2.total : 0;
    html += '<div class="quote-box">';
    html += '<div class="q-row"><span>' + escHtml(prop.name) + '</span><span>' + fmt(amt) + '</span></div>';
    html += '<div class="q-row"><span>' + fmtDate(S.pendingCheckIn) + ' &rarr; ' + fmtDate(co2) + '</span><span>' + S.pendingNights + ' night' + (S.pendingNights===1?"":"s") + '</span></div>';
    html += '</div>';

    var canAddMore = (S.cart.length + 1) < Math.min(MAX_PROPERTIES_PER_BOOKING, S.properties.length);
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap">';
    html += '<button class="btn-primary" style="flex:1;min-width:160px;margin-top:0" onclick="finishAndGoToSummary()">Book &rarr;</button>';
    if (canAddMore) html += '<button class="btn-ghost" style="flex:1;min-width:160px" onclick="addAnotherProperty()">+ Add another property</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// Combined "Or choose your property" section. Works both ways round:
//  - date chosen first: property list narrows to whatever's valid for that date.
//  - property chosen first (or picked here with no date yet): the calendar
//    above (see calendarFilterProperties) narrows to just that property, and
//    this section waits for a check-in date before showing the nights picker.
function renderPropertyAndNightsSection() {
  var usedIds = S.cart.map(function(s) { return s.propertyId; });
  var html = '<h3 class="section-heading"><em>Either</em> choose your property</h3>';
  html += '<div class="panel">';

  if (S.pendingCheckIn) {
    html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">';
    html += '<span style="font-size:14px;color:#7a7060">Check-in <strong style="color:#2d2a25">' + fmtDate(S.pendingCheckIn) + '</strong></span>';
    html += '<button class="btn-ghost" style="padding:5px 13px;font-size:12px" onclick="clearPendingCheckIn()">Change date</button>';
    html += '</div>';
  }

  var candidates;
  if (S.pendingCheckIn) {
    var remaining = S.properties.filter(function(p) { return usedIds.indexOf(p.id) === -1; });
    candidates = dayInfo(S.pendingCheckIn, remaining).checkinOk;
  } else {
    candidates = S.properties.filter(function(p) { return usedIds.indexOf(p.id) === -1; });
  }

  if (!candidates.length) {
    html += S.pendingCheckIn
      ? '<div class="alert alert-warn">No properties are available to check in on this date' + (usedIds.length ? " (or they’re already in your booking)" : "") + '. Please choose a different date above.</div>'
      : '<div class="alert alert-info">All properties have been added to this booking.</div>';
    html += '</div>';
    return html;
  }

  html += '<div class="prop-grid">';
  candidates.forEach(function(p) {
    var sel = S.pendingPropertyId === p.id;
    var col = p.colour || "#2d2a25";
    var rateStr = p.baseRate > 0 ? "From " + fmt(p.baseRate) + " / night" : "Contact for pricing";
    html += '<div class="prop-card' + (sel ? " selected" : "") + '" style="--col:' + col + ';--col-faint:' + col + '22" onclick="selectPendingProperty(\'' + p.id + '\')">';
    html += '<div class="prop-card-head"><span class="prop-dot" style="background:' + col + '"></span><span class="prop-name">' + escHtml(p.name) + '</span></div>';
    var meta = [];
    if (p.sleeps) meta.push("Sleeps " + p.sleeps);
    // Once a date is chosen the seasonal minimum is the one that matters, so
    // show that rather than the property's general rule.
    var metaMin = minNightsForProp(p, S.pendingCheckIn);
    if (metaMin) meta.push(metaMin + " night min");
    if (meta.length) html += '<div class="prop-meta">' + meta.join(" &middot; ") + '</div>';
    html += '<div class="prop-rate">' + rateStr + '</div>';
    html += '</div>';
  });
  html += '</div>';

  if (S.pendingPropertyId && usedIds.indexOf(S.pendingPropertyId) === -1) {
    var prop = S.properties.filter(function(x) { return x.id === S.pendingPropertyId; })[0];
    if (prop) {
      if (!S.pendingCheckIn) {
        html += '<div class="alert alert-info" style="margin-top:14px">The calendar above now shows only ' + escHtml(prop.name) + '&rsquo;s availability &mdash; click a check-in date to continue.</div>';
      } else {
        html += renderPendingNightsSelect(prop);
      }
    }
  }

  html += '</div>';
  return html;
}

// ── View 1: calendar + build-your-booking ────────────────────────────────────
function renderCalendarView() {
  S.view = "calendar";

  // Nothing ticked as publicly bookable — show a note rather than an empty
  // calendar the guest can't do anything with.
  if (!S.properties.length) {
    var closed = stepsHtml(1);
    closed += '<h2 class="page-title">Book Your Stay</h2>';
    closed += '<div class="panel"><p style="color:#7a7060;line-height:1.6;margin:0">';
    closed += 'Online booking isn&rsquo;t available at the moment. Please get in touch and we&rsquo;ll be glad to arrange your stay.';
    closed += '</p></div>';
    mount(closed);
    return;
  }

  var html = renderViewToggle();
  html += stepsHtml(1);
  html += '<h2 class="page-title">Book Your Stay</h2>';
  html += '<p class="page-sub">Choose your check-in date below, or pick a property first to see just its availability. You can add up to ' + Math.min(MAX_PROPERTIES_PER_BOOKING, S.properties.length) + ' properties to one booking.</p>';
  html += renderCartSummary();
  html += renderPropertyAndNightsSection();
  html += '<h3 class="section-heading"><em>Or</em> choose your date</h3>';
  html += renderCalNav();
  var calProps = calendarFilterProperties();
  html += '<div class="cal-months-grid">';
  S.calMonths.forEach(function(m) { html += renderMiniMonth(m.year, m.month, calProps); });
  html += '</div>';
  html += renderCalLegend(calProps);
  mount(html);
}

// Note: neither of these touches pendingPropertyId — a property already
// chosen (property-first path) stays fixed while the guest changes date,
// and the calendar/property-picker stay filtered to it.
function selectCheckInDate(ds) {
  S.pendingCheckIn = ds;
  S.pendingNights = null;
  renderCalendarView();
}
function clearPendingCheckIn() {
  S.pendingCheckIn = null; S.pendingNights = null;
  renderCalendarView();
}
function selectPendingProperty(pid) {
  S.pendingPropertyId = pid;
  S.pendingNights = null;
  renderCalendarView();
}
function selectPendingNights(val) {
  S.pendingNights = val ? parseInt(val, 10) : null;
  renderCalendarView();
}

function pushPendingToCart() {
  if (!S.pendingCheckIn || !S.pendingPropertyId || !S.pendingNights) return false;
  var prop = S.properties.filter(function(x) { return x.id === S.pendingPropertyId; })[0];
  if (!prop) return false;
  var co = addDays(S.pendingCheckIn, S.pendingNights);
  var q = quoteStay(prop, S.pendingCheckIn, co);
  S.cart.push({ propertyId: prop.id, propertyName: prop.name, checkIn: S.pendingCheckIn, checkOut: co, nights: S.pendingNights, value: q ? q.total : 0 });
  S.pendingPropertyId = null;
  S.pendingNights = null;
  return true;
}

function addAnotherProperty() {
  pushPendingToCart(); // keeps S.pendingCheckIn as-is so the same day carries over
  renderCalendarView();
}

function removeFromCart(idx) {
  S.cart.splice(idx, 1);
  renderCalendarView();
}

function finishAndGoToSummary() {
  pushPendingToCart();
  if (!S.cart.length) return;
  S.pendingCheckIn = null;
  renderSummaryView();
}

// ── View 2: summary + guest details + checkout ───────────────────────────────
function setTermsAccepted(on) {
  S.termsAccepted = !!on;
  S.error = "";
  renderSummaryView();
}

function renderSummaryView() {
  S.view = "summary";
  var html = stepsHtml(2);
  html += '<div class="panel">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">';
  html += '<h3 style="margin:0">Your booking</h3>';
  html += '<button class="btn-ghost" onclick="renderCalendarView()">&#8592; Add another property / change dates</button>';
  html += '</div>';

  var propsInCart = S.cart.map(function(s) { return S.properties.filter(function(p) { return p.id === s.propertyId; })[0]; }).filter(Boolean);
  var totalAmt = S.cart.reduce(function(a, s) { return a + s.value; }, 0);

  S.cart.forEach(function(st) {
    html += '<div class="q-row"><span>' + escHtml(st.propertyName) + ' &middot; ' + fmtDate(st.checkIn) + ' &rarr; ' + fmtDate(st.checkOut) + ' &middot; ' + nightsLabel(st) + '</span><span>' + fmt(st.value) + '</span></div>';
  });

  var depPct = propsInCart.reduce(function(a, p) { return Math.max(a, p.depositPct || 50); }, 50);
  var balWks = propsInCart.reduce(function(a, p) { return Math.min(a, p.balanceWeeks != null ? p.balanceWeeks : 6); }, 6);
  var dep = Math.round(totalAmt * depPct) / 100;
  var bal = totalAmt - dep;
  var earliestCheckIn = S.cart.reduce(function(a, s) { return (a === null || s.checkIn < a) ? s.checkIn : a; }, null);
  var balDue = addDays(earliestCheckIn, -balWks * 7);

  html += '<div class="q-row tot"><span>Total</span><span>' + fmt(totalAmt) + '</span></div>';
  html += '<div class="q-row dep"><span>Deposit due now (' + depPct + '%)</span><span>' + fmt(dep) + '</span></div>';
  html += '<div class="q-row bal"><span>Balance due ' + fmtDate(balDue) + '</span><span>' + fmt(bal) + '</span></div>';

  html += '<div class="divider"></div>';
  html += '<h3>About you</h3>';
  html += '<div class="form-grid" style="margin-bottom:16px">';
  html += '<div class="form-field"><label>Full name *</label><input id="f-name" value="' + escHtml(S.guestName) + '" oninput="S.guestName=this.value" placeholder="Jane Smith"></div>';
  html += '<div class="form-field"><label>Email address *</label><input type="email" id="f-email" value="' + escHtml(S.email) + '" oninput="S.email=this.value" placeholder="jane@example.com"></div>';
  html += '<div class="form-field"><label>Phone number</label><input id="f-phone" value="' + escHtml(S.phone) + '" oninput="S.phone=this.value" placeholder="+44 7700 900000"></div>';
  html += '<div class="form-field"><label>Number of guests *</label><input type="number" min="1" max="40" id="f-guests" value="' + (S.guestCount || 2) + '" oninput="S.guestCount=parseInt(this.value)||1"></div>';
  html += '<div class="form-field full"><label>Notes / special requirements</label><textarea id="f-notes" rows="3" oninput="S.notes=this.value" placeholder="Any special requirements or questions...">' + escHtml(S.notes) + '</textarea></div>';
  html += '</div>';

  // Acceptance is required before paying, and the tick is recorded on the
  // booking with a timestamp — the point of asking is being able to show later
  // that the guest was shown them.
  if (S.termsText) {
    html += '<label class="terms-accept' + (S.termsAccepted ? " on" : "") + '">';
    html += '<input type="checkbox" ' + (S.termsAccepted ? "checked" : "") + ' onchange="setTermsAccepted(this.checked)">';
    html += '<span>I have read and accept the <a href="/terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a>.</span>';
    html += '</label>';
  }

  if (S.error) html += '<div class="alert alert-error">' + escHtml(S.error) + '</div>';

  var blockedByTerms = !!S.termsText && !S.termsAccepted;
  html += '<button class="btn-primary" ' + ((S.submitting || blockedByTerms) ? "disabled" : "") + ' onclick="submitBooking()">';
  html += S.submitting ? "Processing&hellip;" : ("Pay deposit " + fmt(dep) + " &rarr;");
  html += '</button>';
  html += '<p class="stripe-note">Secure payment via Stripe &mdash; we never store card details.</p>';
  html += '</div>';

  mount(html);
}

// ── Submit ────────────────────────────────────────────────────────────────────
function submitBooking() {
  if (!S.cart.length) { S.error = "Please add at least one property to your booking."; renderCalendarView(); return; }
  if (!S.guestName.trim()) { S.error = "Please enter your name."; renderSummaryView(); return; }
  if (!S.email.trim() || S.email.indexOf("@") < 0) { S.error = "Please enter a valid email address."; renderSummaryView(); return; }
  if (S.termsText && !S.termsAccepted) { S.error = "Please accept the Terms & Conditions to continue."; renderSummaryView(); return; }

  var propsInCart = S.cart.map(function(s) { return S.properties.filter(function(p) { return p.id === s.propertyId; })[0]; }).filter(Boolean);
  var totalAmount = S.cart.reduce(function(a, s) { return a + s.value; }, 0);
  var depPct = propsInCart.reduce(function(a, p) { return Math.max(a, p.depositPct || 50); }, 50);
  var balWks = propsInCart.reduce(function(a, p) { return Math.min(a, p.balanceWeeks != null ? p.balanceWeeks : 6); }, 6);
  var depositAmount = Math.round(totalAmount * depPct) / 100;

  S.submitting = true; S.error = "";
  renderSummaryView();

  fetch(CHECKOUT_FN, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      stays: S.cart,
      termsAcceptedAt: (S.termsText && S.termsAccepted) ? new Date().toISOString() : null,
      totalAmount: totalAmount,
      depositAmount: depositAmount,
      balanceWeeks: balWks,
      guestName: S.guestName.trim(),
      email: S.email.trim(),
      phone: S.phone.trim(),
      guestCount: S.guestCount,
      notes: S.notes.trim()
    })
  }).then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.url) {
        // Stripe Checkout refuses to be framed (it sends frame-ancestors), so
        // when this page is embedded the payment has to take over the whole
        // window rather than the iframe. Falls back to a normal navigation if
        // the parent is on another origin and blocks the assignment.
        try {
          if (window.top && window.top !== window.self) { window.top.location.href = data.url; return; }
        } catch (e) { /* cross-origin parent — fall through */ }
        window.location.href = data.url;
        return;
      }
      S.submitting = false; S.error = data.error || "Something went wrong. Please try again.";
      renderSummaryView();
    })
    .catch(function() {
      S.submitting = false; S.error = "Connection error. Please check your internet and try again.";
      renderSummaryView();
    });
}

// ── Success page ──────────────────────────────────────────────────────────────
function showSuccess(prop, ci, co) {
  var html = stepsHtml(3);
  html += '<div class="panel" style="text-align:center;padding:50px 28px">';
  html += '<div style="font-size:52px;margin-bottom:18px">&#10003;</div>';
  html += '<h2 style="font-family:\'Cormorant Garamond\',serif;font-size:26px;font-weight:600;margin-bottom:10px">Booking confirmed!</h2>';
  html += '<p style="color:#7a7060;margin-bottom:22px">Thank you for booking with Hawthbush Farm. A confirmation email is on its way.</p>';
  if (ci) {
    html += '<div class="quote-box" style="max-width:340px;margin:0 auto;text-align:left">';
    if (prop) html += '<div class="q-row"><span>Property</span><span>' + escHtml(decodeURIComponent(prop)) + '</span></div>';
    html += '<div class="q-row"><span>Check-in</span><span>' + fmtDate(ci) + '</span></div>';
    if (co) html += '<div class="q-row"><span>Check-out</span><span>' + fmtDate(co) + '</span></div>';
    html += '</div>';
  }
  html += '</div>';
  mount(html);
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  var params = new URLSearchParams(window.location.search);

  // Compact layout is the default. ?compact=0 falls back to the original
  // roomier layout, which is still fully supported by the Standard toggle.
  S.compact = params.get("compact") !== "0";
  applyCompactClass();

  // Skip sync on the post-booking success/cancel return pages
  if (params.get("booked") === "1") {
    Promise.all([sbGet("hbf_properties_v1"), sbGet("hbf_accom_v1")]).then(function() {
      showSuccess(params.get("prop"), params.get("ci"), params.get("co"));
    });
    return;
  }

  function loadAndRender() {
    return Promise.all([sbGet("hbf_properties_v1"), sbGet("hbf_accom_v1"), sbGet("hbf_terms_v1")]).then(function(results) {
      var propsData = results[0];
      var accomData = results[1];
      // No terms written yet means no tickbox and no link — better than sending
      // guests to an empty page and asking them to accept nothing.
      S.termsText = (results[2] && results[2].text) ? String(results[2].text) : "";
      // Only properties ticked as publicly bookable reach this page. Filtering
      // once here means everything downstream — the calendar letters, the
      // legend, the property cards, availability — follows automatically.
      // A property saved before this setting existed has no flag at all, so
      // undefined counts as visible; nothing disappears on deploy.
      // Unticking everything is a legitimate "close online booking" switch, so
      // an empty result is honoured rather than falling back to the defaults.
      var publicOnly = function(list) {
        return (list || []).filter(function(p) { return p && p.publicBookable !== false; });
      };
      S.properties = (propsData && propsData.length) ? publicOnly(propsData) : [
        { id:"hamlet",   name:"The Hamlet",  sleeps:14, colour:"#2563eb", depositPct:50, balanceWeeks:4, minNights:2, maxNights:28, baseRate:0, seasons:[] },
        { id:"amly",     name:"Amly Barn",   sleeps:6,  colour:"#16a34a", depositPct:50, balanceWeeks:6, minNights:2, maxNights:28, baseRate:0, seasons:[] },
        { id:"glamping", name:"Glamping",    sleeps:20, colour:"#9333ea", depositPct:20, balanceWeeks:6, minNights:2, maxNights:28, baseRate:0, seasons:[] }
      ];
      S.bookings = (accomData || []).map(function(b) {
        if (b.stays && b.stays.length) return b;
        return Object.assign({}, b, { stays: [{ propertyId: b.propertyId, checkIn: b.checkIn, checkOut: b.checkOut }] });
      });
      S.calMonths = calMonthsList();
      buildAvailability();
      if (params.get("cancelled") === "1") {
        renderCalendarView();
        document.getElementById("app").insertAdjacentHTML("afterbegin",
          '<div class="alert alert-warn" style="margin-bottom:16px">Your booking was not completed &mdash; you have not been charged.</div>');
      } else {
        renderCalendarView();
      }
    });
  }

  // Trigger an Airbnb iCal sync so availability is up to date before the
  // guest sees the calendar. We race it against a 6-second timeout — if
  // Airbnb is slow we fall through and show existing data rather than
  // making the guest wait.
  var syncPromise = fetch(SYNC_FN, { method: "POST" }).then(function() {}).catch(function() {});
  var timeout = new Promise(function(resolve) { setTimeout(resolve, 6000); });

  Promise.race([syncPromise, timeout]).then(function() {
    return loadAndRender();
  }).catch(function(e) {
    console.error(e);
    mount('<div class="alert alert-error">Could not load availability. Please refresh the page.</div>');
  });
})();
</script>
